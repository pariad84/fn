name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pinned playwright, so the browser it downloads matches the version in package.json.
      - run: npx playwright install --with-deps chromium
      - run: npm test
