<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>fn test page</title>
</head>
<body style="font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 24px; color: #1a1a1a;">
<h1>fn.js + fn.layout.js</h1>
<p>A single <code>button</code> opens a <code>popup</code> with a <code>list</code> inside it, all
built from <code>fn.layout.js</code>'s conventions.</p>
<div id="app"></div>
<script src="fn.js"></script>
<script src="fn.util.js"></script>
<script src="fn.layout.js"></script>
<script>

    var fields = [
        { name : 'text', label : 'Text', form : { type : 'text', placeholder : 'Text' } },
        { name : 'select', label : 'Select', form : { type : 'select', datas : [
            { value : 'option1', label : 'Option 1' },
            { value : 'option2', label : 'Option 2' }
        ] } },
        { name : 'radio', label : 'Radio', form : { type : 'radio', datas : [
            { value : 'radio1', label : 'Radio 1' },
            { value : 'radio2', label : 'Radio 2' }
        ] } },
        { name : 'datetime', label : 'Datetime', form : { type : 'datetime-local' } },
    ];

    var app = document.getElementById('app');
    fn.component.create({
        name : 'button',
        text : 'Open list',
        style : { padding : '8px 16px' },
        parent : app,
        event : { click : function() {
            fn.component.create({
                parent : document.body,
                name : 'popup',
                title : 'List',
                fields : fields,
                init : function(opt) {
                    fn.component.create({
                        name : 'btn-new',
                        parent : opt.header,
                        click : function() {
                            fn.component.create({
                                name : 'popup',
                                title : 'New item',
                                caller : opt.popup._.caller,
                                fields : fields,
                                parent : document.body,
                                init : function(popupOpt) {
                                    fn.component.create({
                                        name : 'btn-save',
                                        text : '💾',
                                        parent : popupOpt.header,
                                        save : function(data) {
                                            return fn.data.insert({ key : 'item', data : data });
                                        },
                                    });
                                },
                                render : function(popupOpt) {
                                    fn.component.create({ name : 'form', fields : popupOpt.popup._.fields, data : {}, parent : popupOpt.content });
                                },
                            });
                        },
                    });
                },
                render : function(opt) {
                    opt.popup._.caller = fn.component.create({
                        name : 'list',
                        fields : opt.popup._.fields,
                        parent : opt.content,
                        select : function() {
                            return fn.data.select({ key : 'item' }).map(function(row) {
                                return Object.assign({ id : row.id }, row.data);
                            });
                        },
                        click : function(item, list) {
                            fn.component.create({
                                name : 'popup',
                                title : 'Edit item',
                                caller : list,
                                fields : fields,
                                parent : document.body,
                                init : function(popupOpt) {
                                    fn.component.create({
                                        name : 'btn-save',
                                        text : '💾',
                                        parent : popupOpt.header,
                                        save : function(data) {
                                            return fn.data.update({ key : 'item', id : item.id, data : data });
                                        },
                                    });
                                },
                                render : function(popupOpt) {
                                    fn.component.create({ name : 'form', fields : popupOpt.popup._.fields, data : item, parent : popupOpt.content });
                                },
                            });
                        },
                    });
                },
            });
        } },
    });
</script>
</body>
</html>
