<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>fn test page</title>
</head>
<body style="font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 24px; color: #1a1a1a;">
<h1>fn.js + fn.layout.js</h1>
<p>Wires up <code>fn.layout.js</code>'s <code>popup</code>/<code>close-btn</code>/<code>save-btn</code> and
<code>input</code>/<code>select</code>/<code>radio</code>/<code>form</code>/<code>list</code> layouts
against a plain field-definition array -- this file only supplies data and app wiring, no layouts.</p>
<div id="app"></div>
<script src="fn.js"></script>
<script src="fn.layout.js"></script>
<script>

    var fields = [
        { name : 'text', label : 'Text', form : { type : 'text', placeholder : 'Text' }, list : { type : 'text' } },
        { name : 'select', label : 'Select', form : { type : 'select', datas : [
            { value : 'option1', label : 'Option 1' },
            { value : 'option2', label : 'Option 2' }
        ] }, list : { type : 'text' } },
        { name : 'radio', label : 'Radio', form : { type : 'radio', datas : [
            { value : 'radio1', label : 'Radio 1' },
            { value : 'radio2', label : 'Radio 2' }
        ] }, list : { type : 'text' } },
        { name : 'datetime', label : 'Datetime', form : { type : 'datetime-local' }, list : { type : 'text' } },
    ];

    var app = document.getElementById('app');
    fn.component.create({
        name : 'button',
        text : '+ New item',
        style : { padding : '8px 16px', marginBottom : '12px' },
        parent : app,
        event : { click : function() {
            fn.component.create({
                name : 'popup',
                title : 'New item',
                caller : list,
                fields : fields,
                render : function(popupEl) {
                    fn.component.create({ name : 'form', fields : popupEl._.fields, data : {}, parent : popupEl.content });
                    fn.component.create({ name : 'save-btn', parent : popupEl.content });
                },
            });
        } },
    });
    var list = fn.component.create({ name : 'list', fields : fields, parent : app });
</script>
</body>
</html>
